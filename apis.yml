name: Orqa
description: Orqa is an aerial robotics company founded in 2018 and headquartered in
  Osijek, Croatia, that designs and manufactures mission-ready FPV (first-person view)
  drone systems for the defense and enterprise markets. With full vertical integration,
  Orqa builds every component in-house — tactical drones such as the MRM1-5 and MRM2-10,
  FPV goggles (FPV.One Pilot), controllers, simulators, and detection equipment — to
  keep its supply chain secure and its systems high-performance. The company is ISO 9001
  certified and backed by Lightspeed Venture Partners (Seed round, 2024, partners Antoine
  Moyroud and Alexander Schmitt). As of this profile Orqa is a hardware manufacturer and
  does not publish a public developer API, SDKs, or a programmatic developer surface;
  this repository tracks it for identity and network completeness.
